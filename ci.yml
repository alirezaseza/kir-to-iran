name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate-script:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/validate_subscription.py scripts/check_i18n.py
      - run: python3 scripts/check_i18n.py
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.x" }
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ hashFiles('scripts/build-libbox.sh') }}
      - name: Build libbox (sing-box core)
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Unit tests + lint
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports
            app/build/test-results
  assemble-release:
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.x" }
      - name: Cache libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ hashFiles('scripts/build-libbox.sh') }}
      - name: Build libbox if missing
        run: test -f app/libs/libbox.aar || bash scripts/build-libbox.sh
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Assemble release (R8 + resource shrinking sanity check)
        run: ./gradlew assembleRelease --stacktrace
      - name: Report APK sizes
        run: ls -l app/build/outputs/apk/release/*.apk
