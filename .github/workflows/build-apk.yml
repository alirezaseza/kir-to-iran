name: Build APK
on:
  workflow_dispatch: {}
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-go@v5
        with: { go-version: "1.24.x" }
      - name: Install NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;27.2.12479018" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Cache libbox
        id: libbox
        uses: actions/cache@v4
        with:
          path: app/libs/libbox.aar
          key: libbox-${{ hashFiles('scripts/build-libbox.sh') }}
      - name: Build libbox
        if: steps.libbox.outputs.cache-hit != 'true'
        run: bash scripts/build-libbox.sh
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KestrelVPN-debug-apk
          path: app/build/outputs/apk/debug/*.apk
